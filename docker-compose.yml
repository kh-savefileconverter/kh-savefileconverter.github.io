version: '3.8'

services:
  kh-converter:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.io/local/kh-savefile-converter:latest
    container_name: kh-savefile-converter
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
